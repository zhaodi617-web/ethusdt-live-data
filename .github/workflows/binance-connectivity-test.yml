name: Binance USD-M Futures Connectivity Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test Binance public USD-M futures endpoints (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          base = "https://fapi.binance.com"
          endpoints = {
              "ticker": "/fapi/v1/ticker/price?symbol=ETHUSDT",
              "klines_15m": "/fapi/v1/klines?symbol=ETHUSDT&interval=15m&limit=2",
              "klines_1h": "/fapi/v1/klines?symbol=ETHUSDT&interval=1h&limit=2",
              "open_interest": "/fapi/v1/openInterest?symbol=ETHUSDT",
          }
          print("UTC:", datetime.now(timezone.utc).isoformat())
          print("Market: Binance USD-M Futures / ETHUSDT")
          print("No orders, keys, or changes to research files.")
          for label, endpoint in endpoints.items():
              req = urllib.request.Request(base + endpoint, headers={"User-Agent": "ObserverLadderConnectivityDiagnostic/1.0", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      body = resp.read(150000)
                      try:
                          payload = json.loads(body)
                          valid = (
                              payload.get("symbol") == "ETHUSDT" and "price" in payload
                              if label == "ticker" else
                              isinstance(payload, list) and len(payload) > 0
                              if label.startswith("klines") else
                              payload.get("symbol") == "ETHUSDT" and "openInterest" in payload
                          )
                      except (ValueError, AttributeError):
                          valid = False
                      print(f"{label}: HTTP {resp.status}; valid_expected_schema={valid}")
              except urllib.error.HTTPError as err:
                  print(f"{label}: HTTP {err.code} (endpoint restricted or unavailable)")
              except Exception as err:
                  print(f"{label}: NETWORK_ERROR {type(err).__name__}")
          PY
