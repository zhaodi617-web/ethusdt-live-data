name: CG-Direction Independent Telegram

on:
  workflow_run:
    workflows: ["CG-Direction V1 Independent Shadow"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a CG1 Telegram test message"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cg-direction-telegram-independent
  cancel-in-progress: false
  queue: max

jobs:
  notify:
    if: >-
      vars.CG_STORAGE_AUTHORIZED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public research code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout private storage
        uses: actions/checkout@v4
        with:
          repository: zhaodi617-web/observer-ladder-private-data
          ref: main
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-storage

      - name: Validate notifier syntax
        run: python3 -m py_compile cg_direction_telegram.py

      - name: Test CG1 Telegram connection
        if: github.event_name == 'workflow_dispatch' && inputs.test_message
        env:
          CG_TELEGRAM_BOT_TOKEN: ${{ secrets.CG_TELEGRAM_BOT_TOKEN }}
          CG_TELEGRAM_CHAT_ID: ${{ secrets.CG_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import cg_direction_telegram as notifier

          notifier.send_message(
              "【Observer Ladder｜CG1 系统测试】\n\n"
              "Telegram 通知连接正常。\n"
              "此消息仅用于验证通知系统，"
              "不是方向预测或交易信号。"
          )

          print("CG1 Telegram test delivery accepted")
          PY

      - name: Prepare private notification workspace
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(".")
          private = root / "private-storage" / "models" / "cg_v1"
          work = Path(os.environ["RUNNER_TEMP"]) / "cg_v1_notify"

          private.mkdir(parents=True, exist_ok=True)
          work.mkdir(parents=True, exist_ok=True)

          names = [
              "cg_direction_v1_predictions.jsonl",
              "cg_direction_v1_verifications.jsonl"
          ]

          present = [
              (private / name).exists()
              for name in names
          ]

          if any(present) and not all(present):
              raise RuntimeError(
                  "Incomplete private prediction history"
              )

          source = private if all(present) else root

          for name in names:
              if not (source / name).exists():
                  raise RuntimeError(
                      "Required prediction history missing"
                  )

              shutil.copy2(
                  source / name,
                  work / name
              )

          print(
              "Prediction source:",
              "PRIVATE" if all(present)
              else "PUBLIC_TRANSITION"
          )

          state_name = "cg_direction_telegram_state.json"
          sent = set()

          for path in (
              root / state_name,
              private / state_name
          ):
              if path.exists():
                  state = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  events = state["sent_events"]

                  assert isinstance(events, list)
                  assert all(
                      isinstance(x, str)
                      for x in events
                  )

                  sent.update(events)

          payload = {
              "sent_events": sorted(sent)
          }

          (work / state_name).write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8"
          )

          (work / "previous_state.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )

          print(
              "Existing notification IDs preserved:",
              len(sent)
          )
          PY

      - name: Diagnose CG1 notification eligibility
        run: |
          cd "$RUNNER_TEMP/cg_v1_notify"

          python3 - <<'PY'
          import os
          import sys
          import time

          sys.path.insert(
              0, os.environ["GITHUB_WORKSPACE"]
          )

          import cg_direction_telegram as n

          now = int(time.time() * 1000)

          predictions = [
              p for p in n.read_jsonl(n.PREDICTIONS)
              if p.get("model") == "cg_direction_v1"
          ]

          verifications = [
              v for v in n.read_jsonl(n.VERIFICATIONS)
              if v.get("model") == "cg_direction_v1"
          ]

          sent = set(
              n.load_state().get("sent_events", [])
          )

          def prediction_status(p):
              if p.get("signal") not in n.VALID_SIGNALS:
                  if p.get("reason") == "MISSING_OR_STALE_SOURCE":
                      return "MISSING_OR_STALE_SOURCE"
                  return "NON_DIRECTIONAL"

              if p.get("reference_price") is None:
                  return "MISSING_REFERENCE_PRICE"

              ts = int(p["prediction_time_ms"])
              event_id = "prediction:" + str(ts)

              if event_id in sent:
                  return "ALREADY_SENT"

              age = now - ts

              if age < 0:
                  return "FUTURE_TIMESTAMP"

              if age > n.PREDICTION_AGE_MS:
                  return "EXPIRED_UNSENT"

              return "ELIGIBLE_UNSENT"

          def verification_status(v):
              if v.get("signal") not in n.VALID_SIGNALS:
                  return "NON_DIRECTIONAL"

              ts = int(v["prediction_time_ms"])
              event_id = "verification:" + str(ts)

              if event_id in sent:
                  return "ALREADY_SENT"

              created = int(v.get("verified_at_ms", 0))

              if created <= 0:
                  return "MISSING_VERIFICATION_TIMESTAMP"

              age = now - created

              if age < 0:
                  return "FUTURE_TIMESTAMP"

              if age > n.VERIFICATION_AGE_MS:
                  return "EXPIRED_UNSENT"

              return "ELIGIBLE_UNSENT"

          if predictions:
              latest = max(
                  predictions,
                  key=lambda p: int(p["prediction_time_ms"])
              )

              print(
                  "Latest prediction notification status:",
                  prediction_status(latest)
              )
          else:
              print("No prediction records")

          if verifications:
              latest = max(
                  verifications,
                  key=lambda v: int(v.get("verified_at_ms", 0))
              )

              print(
                  "Latest verification notification status:",
                  verification_status(latest)
              )
          else:
              print("No verification records")

          events = n.collect_events(now)

          eligible = sum(
              event_id not in sent
              for _, event_id, _ in events
          )

          duplicates = sum(
              event_id in sent
              for _, event_id, _ in events
          )

          window = 6 * 60 * 60 * 1000

          expired_predictions = sum(
              0 <= now - int(p["prediction_time_ms"]) <= window
              and prediction_status(p) == "EXPIRED_UNSENT"
              for p in predictions
          )

          expired_verifications = sum(
              0 <= now - int(v.get("verified_at_ms", 0)) <= window
              and verification_status(v) == "EXPIRED_UNSENT"
              for v in verifications
          )

          print("Prediction records:", len(predictions))
          print("Verification records:", len(verifications))
          print("Eligible new notifications:", eligible)
          print("Duplicates suppressed:", duplicates)
          print("Expired unsent predictions in 6h:", expired_predictions)
          print("Expired unsent verifications in 6h:", expired_verifications)

          print("CG1 notification diagnosis completed")
          PY

      - name: Send independent CG research alerts
        env:
          CG_TELEGRAM_BOT_TOKEN: ${{ secrets.CG_TELEGRAM_BOT_TOKEN }}
          CG_TELEGRAM_CHAT_ID: ${{ secrets.CG_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/cg_v1_notify"

          if python3 "$GITHUB_WORKSPACE/cg_direction_telegram.py" \
              > "$RUNNER_TEMP/cg_v1_notify.log" 2>&1; then
            echo "CG private notifier completed"
          else
            echo "CG notifier failed"
            exit 1
          fi

      - name: Validate and prepare notification state
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          work = Path(os.environ["RUNNER_TEMP"]) / "cg_v1_notify"

          name = "cg_direction_telegram_state.json"

          previous = set(
              json.loads(
                  (work / "previous_state.json").read_text()
              )["sent_events"]
          )

          current = set(
              json.loads(
                  (work / name).read_text()
              )["sent_events"]
          )

          assert previous.issubset(current)

          destination = (
              Path("private-storage")
              / "models"
              / "cg_v1"
              / name
          )

          shutil.copy2(
              work / name,
              destination
          )

          print("Notification history validation passed")
          print("New notification IDs:", len(current - previous))
          print("Total preserved IDs:", len(current))
          PY

      - name: Save private notification state
        working-directory: private-storage
        run: |
          set -euo pipefail

          git config user.name "Observer Ladder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add models/cg_v1/cg_direction_telegram_state.json

          if git diff --cached --quiet; then
            echo "No new notification state"
            exit 0
          fi

          git commit -m "Save private CG notification state"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "State conflict; no records overwritten"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Private notification state saved"
              exit 0
            fi

            sleep 3
          done

          echo "Private notification persistence failed"
          exit 1

      - name: Clean temporary notification workspace
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/cg_v1_notify"
          rm -f "$RUNNER_TEMP/cg_v1_notify.log"
