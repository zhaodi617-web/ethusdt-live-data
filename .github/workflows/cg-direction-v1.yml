name: CG-Direction V1 Independent Shadow

on:
  workflow_run:
    workflows: ["Update OKX ETH Price"]
    types: [completed]
    branches: [main]

  schedule:
    - cron: "9-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cg-direction-v1-independent
  cancel-in-progress: false

jobs:
  predict:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate Python syntax
        run: |
          python3 -m py_compile cg_direction_v1.py
          python3 -m py_compile cg_direction_v1_verify.py

      - name: Generate independent CG direction
        run: python3 cg_direction_v1.py

      - name: Verify CG direction predictions
        run: python3 cg_direction_v1_verify.py

      - name: Save independent CG records
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            cg_direction_v1_activation.json \
            cg_direction_v1_predictions.jsonl \
            cg_direction_v1_latest.json \
            cg_direction_v1_verifications.jsonl \
            cg_direction_v1_summary.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new CG records"
            exit 0
          fi

          git commit -m "Record CG-Direction V1 research"

          pushed=false

          for attempt in $(seq 1 12); do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; no records overwritten"
              exit 1
            fi

            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            sleep 2
          done

          if [ "$pushed" != true ]; then
            echo "CG research persistence failed"
            exit 1
          fi

      - name: Research status
        run: |
          echo "CG-Direction V1 independent research"
          echo "Prediction and verification enabled"
          echo "Triggered by successful OKX update or schedule"
          echo "CG Telegram handled by independent workflow"
          echo "Original V1 and V1-CG untouched"
          echo "No live trading"
