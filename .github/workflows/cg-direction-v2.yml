name: CG-Direction V2 Independent Shadow

on:
  schedule:
    - cron: '7-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cg-direction-v2-independent
  cancel-in-progress: false

jobs:
  research:
    if: vars.CG_STORAGE_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public research code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout private storage
        uses: actions/checkout@v4
        with:
          repository: zhaodi617-web/observer-ladder-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-storage

      - name: Validate Python syntax
        run: |
          python3 -m py_compile cg_direction_v2.py
          python3 -m py_compile cg_direction_v2_rules.py
          python3 -m py_compile cg_direction_v2_runner.py

      - name: Prepare private V2 workspace
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path(".")
          private = root / "private-storage"
          work = private / "models" / "cg_v2"
          work.mkdir(parents=True, exist_ok=True)

          names = [
              "cg_direction_v2_activation.json",
              "cg_direction_v2_predictions.jsonl",
              "cg_direction_v2_verifications.jsonl",
              "cg_direction_v2_latest.json",
              "cg_direction_v2_summary.json"
          ]

          for name in names:
              source = root / name
              target = work / name

              if source.exists() and not target.exists():
                  shutil.copy2(source, target)

          inputs = [
              "okx_latest.json",
              "okx_candles.json",
              "cg_direction_v1_predictions.jsonl",
              "cg_direction_v1_verifications.jsonl"
          ]

          for name in inputs:
              source = root / name
              if source.exists():
                  shutil.copy2(source, work / name)

          for metric in ("oi", "taker"):
              name = f"coinglass_{metric}_history.jsonl"
              source = private / "coinglass" / metric / name

              assert source.exists()

              records = {}

              for path in (root / name, source):
                  if not path.exists():
                      continue

                  for line in path.read_text().splitlines():
                      if not line.strip():
                          continue

                      row = json.loads(line)
                      timestamp = int(row["collected_at_ms"])

                      if timestamp in records:
                          assert records[timestamp] == row

                      records[timestamp] = row

              assert records

              target = work / name

              target.write_text(
                  "".join(
                      json.dumps(records[t]) + "\n"
                      for t in sorted(records)
                  ),
                  encoding="utf-8"
              )

          print("Private V2 workspace ready")
          PY

      - name: Connect private advanced features
        run: |
          test -f private-storage/coinglass/features_latest.json

          cp private-storage/coinglass/features_latest.json \
             private-storage/models/cg_v2/coinglass_features_latest.json

          echo "Advanced features connected"

      - name: Run V2 safety checks
        run: |
          python3 - <<'PY'
          import cg_direction_v2 as core
          import cg_direction_v2_rules as rules
          import cg_direction_v2_runner as runner

          now = 1800000000000

          rows = [
              {"collected_at_ms": now - 1000},
              {"collected_at_ms": now + 1000}
          ]

          assert core.latest_asof(
              rows, now, 60000
          )["collected_at_ms"] == now - 1000

          assert core.latest_asof(
              rows, now - 100000, 60000
          ) is None

          assert core.VERSION == "cg_direction_v2_shadow_1.1"
          assert rules.RULE_VERSION == "1.2"

          runner.safety_tests()

          print("CG V2 safety checks passed")
          PY

      - name: Check private input freshness
        working-directory: private-storage/models/cg_v2
        run: |
          python3 - <<'PY'
          import json
          import time
          from pathlib import Path

          now = int(time.time() * 1000)

          advanced = json.loads(
              Path("coinglass_features_latest.json").read_text()
          )

          age = now - int(
              advanced["source_collected_at_ms"]
          )

          assert advanced["symbol"] == "ETH"
          assert advanced["feature_version"] == "1.0"
          assert 0 <= age <= 1200000

          for metric in ("oi", "taker"):
              path = Path(
                  f"coinglass_{metric}_history.jsonl"
              )

              rows = [
                  json.loads(line)
                  for line in path.read_text().splitlines()
                  if line.strip()
              ]

              eligible = [
                  int(row["collected_at_ms"])
                  for row in rows
                  if int(row["collected_at_ms"]) <= now
              ]

              assert eligible

              if now - max(eligible) <= 1200000:
                  print(f"{metric}: FRESH")
              else:
                  print(f"{metric}: STALE - directional signal unavailable")

          print("Advanced input freshness passed")
          PY

      - name: Run private V2 research
        working-directory: private-storage/models/cg_v2
        env:
          CG_V2_RULE: "1.2"
        run: |
          python3 "$GITHUB_WORKSPACE/cg_direction_v2_runner.py" > "$RUNNER_TEMP/cg_v2.log" 2>&1

          echo "Private V2 research completed"

      - name: Validate V2 research records
        working-directory: private-storage/models/cg_v2
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("cg_direction_v2_summary.json").read_text()
          )

          assert summary["rule_version"] == "1.2"
          assert summary["model"] == "cg_direction_v2_shadow_1.2"

          assert summary["simulation_only"] is True
          assert summary["live_order_allowed"] is False
          assert summary["telegram_enabled"] is False

          versions = summary["history_by_rule_version"]

          assert set(versions) == {"1.0", "1.1", "1.2"}

          assert sum(
              v["predictions_total"]
              for v in versions.values()
          ) == summary["all_versions_predictions_total"]

          assert sum(
              v["verified_total"]
              for v in versions.values()
          ) == summary["all_versions_verified_total"]

          for name in (
              "cg_direction_v2_predictions.jsonl",
              "cg_direction_v2_verifications.jsonl"
          ):
              path = Path(name)

              if not path.exists():
                  continue

              rows = [
                  json.loads(line)
                  for line in path.read_text().splitlines()
                  if line.strip()
              ]

              ids = [
                  int(row["prediction_time_ms"])
                  for row in rows
              ]

              assert len(ids) == len(set(ids))

          print("V2 research validation passed")
          print("Rule versions separated")
          print("New predictions:", summary["new_predictions"])
          print("New verifications:", summary["new_verifications"])
          print("Rule 1.2 predictions:", versions["1.2"]["predictions_total"])
          PY

      - name: Save private V2 research
        working-directory: private-storage
        run: |
          git config user.name "Observer Ladder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for name in activation.json predictions.jsonl verifications.jsonl latest.json summary.json; do
            file="models/cg_v2/cg_direction_v2_$name"

            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new V2 research records"
            exit 0
          fi

          git commit -m "Update private CG V2 rule 1.2 research"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Private V2 storage successful"
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep 3
          done

          exit 1

      - name: Clean temporary research inputs
        if: always()
        run: |
          work="private-storage/models/cg_v2"

          rm -f "$work/okx_latest.json"
          rm -f "$work/okx_candles.json"
          rm -f "$work/coinglass_oi_history.jsonl"
          rm -f "$work/coinglass_taker_history.jsonl"
          rm -f "$work/coinglass_features_latest.json"
          rm -f "$work/cg_direction_v1_predictions.jsonl"
          rm -f "$work/cg_direction_v1_verifications.jsonl"
          rm -f "$RUNNER_TEMP/cg_v2.log"
