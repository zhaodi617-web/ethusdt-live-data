name: CoinGlass Advanced Collector

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinglass-advanced-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public research code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private storage
        uses: actions/checkout@v4
        with:
          repository: zhaodi617-web/observer-ladder-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-storage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python programs
        run: |
          python -m py_compile fetch_coinglass_advanced.py
          python -m py_compile coinglass_advanced_features.py

      - name: Verify storage readiness
        run: |
          test -d private-storage/.git
          echo "Private storage connection ready"

      - name: Check data storage authorization
        env:
          STORAGE_AUTHORIZED: ${{ vars.CG_STORAGE_AUTHORIZED }}
        run: |
          if [ "$STORAGE_AUTHORIZED" != "true" ]; then
            echo "Waiting for CoinGlass storage authorization"
            exit 1
          fi

      - name: Collect and process data
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: |
          rm -f coinglass_advanced_latest.json
          rm -f coinglass_advanced_history.jsonl
          rm -f coinglass_features_latest.json
          rm -f coinglass_features_history.jsonl

          python fetch_coinglass_advanced.py > /tmp/cg_collect.log 2>&1
          python coinglass_advanced_features.py > /tmp/cg_features.log 2>&1

          echo "Data processing completed"

      - name: Prepare private research records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("private-storage/coinglass")

          raw = json.loads(
              Path("coinglass_advanced_latest.json").read_text()
          )

          features = json.loads(
              Path("coinglass_features_latest.json").read_text()
          )

          timestamp = raw["finished_at_ms"]

          assert features["source_collected_at_ms"] == timestamp

          day = datetime.fromtimestamp(
              timestamp / 1000, timezone.utc
          ).strftime("%Y-%m-%d")

          for name, data in (
              ("raw", raw),
              ("features", features)
          ):
              folder = root / name / day
              folder.mkdir(parents=True, exist_ok=True)

              target = folder / f"{timestamp}.json"

              target.write_text(
                  json.dumps(data, ensure_ascii=False),
                  encoding="utf-8"
              )

              latest = root / f"{name}_latest.json"

              latest.write_text(
                  json.dumps(data, ensure_ascii=False),
                  encoding="utf-8"
              )

          print("Private research records prepared")
          PY

      - name: Save to private repository only
        working-directory: private-storage
        run: |
          git config user.name "Observer Ladder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coinglass/

          if git diff --cached --quiet; then
            echo "No new records"
            exit 0
          fi

          git commit -m "Update private CG research records"
          git push origin HEAD:main

          echo "Private storage successful"

      - name: Clean temporary files
        if: always()
        run: |
          rm -f coinglass_advanced_latest.json
          rm -f coinglass_advanced_history.jsonl
          rm -f coinglass_features_latest.json
          rm -f coinglass_features_history.jsonl
          rm -f /tmp/cg_collect.log
          rm -f /tmp/cg_features.log
