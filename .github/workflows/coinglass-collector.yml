name: CoinGlass ETH OI Collector

on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinglass-eth-oi-collector
  cancel-in-progress: false

jobs:
  collect:
    if: vars.CG_STORAGE_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public research code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private storage
        uses: actions/checkout@v4
        with:
          repository: zhaodi617-web/observer-ladder-private-data
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: private-storage

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate collector
        run: python -m py_compile fetch_coinglass.py

      - name: Prepare private OI storage
        run: |
          mkdir -p private-storage/coinglass/oi

      - name: Collect OI privately
        working-directory: private-storage/coinglass/oi
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: |
          python "$GITHUB_WORKSPACE/fetch_coinglass.py" > "$RUNNER_TEMP/cg_oi.log" 2>&1
          echo "OI collection completed"

      - name: Validate private OI records
        working-directory: private-storage/coinglass/oi
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          data = json.loads(
              Path("coinglass_oi_latest.json").read_text()
          )

          assert data["asset"] == "ETH"

          for exchange in ("All", "Binance", "OKX"):
              assert data["data"][exchange]["open_interest_usd"] > 0

          age = int(time.time() * 1000) - data["collected_at_ms"]

          assert 0 <= age <= 300000

          print("Private OI validation passed")
          PY

      - name: Save OI to private repository
        working-directory: private-storage
        run: |
          git config user.name "Observer Ladder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coinglass/oi/

          if git diff --cached --quiet; then
            echo "No new records"
            exit 0
          fi

          git commit -m "Update private CoinGlass ETH OI"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Private OI storage successful"
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep 3
          done

          exit 1

      - name: Clean temporary logs
        if: always()
        run: rm -f "$RUNNER_TEMP/cg_oi.log"
