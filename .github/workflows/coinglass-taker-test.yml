name: CoinGlass ETH Taker Ratio Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test ETH 4h taker ratio
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          key = os.environ.get(
              "COINGLASS_API_KEY", ""
          ).strip()

          if not key:
              raise SystemExit(
                  "FAIL: API key missing"
              )

          url = (
              "https://open-api-v4.coinglass.com"
              "/api/futures/"
              "taker-buy-sell-volume/exchange-list?"
              + urllib.parse.urlencode({
                  "symbol": "ETH",
                  "range": "4h"
              })
          )

          request = urllib.request.Request(
              url,
              headers={
                  "CG-API-KEY": key,
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=25
              ) as response:
                  payload = json.load(response)

          except urllib.error.HTTPError as e:
              print("HTTP status:", e.code)
              raise SystemExit(
                  "FAIL: HTTP request rejected"
              )

          if str(payload.get("code")) != "0":
              print("API code:", payload.get("code"))
              print(
                  "API message:",
                  str(
                      payload.get(
                          "msg",
                          payload.get("message", "")
                      )
                  )[:200]
              )
              raise SystemExit(
                  "FAIL: CoinGlass API rejected 4h"
              )

          data = payload.get("data")

          if not isinstance(data, dict):
              raise SystemExit(
                  "FAIL: Unexpected data format"
              )

          buy = float(data["buy_ratio"])
          sell = float(data["sell_ratio"])

          if not (
              0 <= buy <= 100
              and 0 <= sell <= 100
              and abs(buy + sell - 100) < 1
          ):
              raise SystemExit(
                  "FAIL: Invalid percentage values"
              )

          print("PASS: CoinGlass ETH 4h API")
          print("All exchanges buy %:", buy)
          print("All exchanges sell %:", sell)

          for row in data.get(
              "exchange_list", []
          ):
              if row.get("exchange") in (
                  "Binance", "OKX"
              ):
                  print(
                      row["exchange"],
                      "buy %:", row.get("buy_ratio"),
                      "sell %:", row.get("sell_ratio")
                  )

          print("TEST COMPLETE")
          print("No files or models modified")
          PY
