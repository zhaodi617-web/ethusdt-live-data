name: Observer Ladder V1-CG Independent Shadow

on:
  workflow_run:
    workflows: ["Update OKX ETH Price"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-v1-cg-independent
  cancel-in-progress: false

jobs:
  v1-cg:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Check Python syntax
        run: |
          python3 -m py_compile v1_cg_shadow.py
          python3 -m py_compile v1_cg_verify.py
          python3 -m py_compile v1_cg_telegram.py

      - name: Run independent V1-CG prediction
        run: python3 v1_cg_shadow.py

      - name: Verify 60-minute outcomes
        run: python3 v1_cg_verify.py

      - name: Save independent research records
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            v1_cg_protocol.json \
            v1_cg_predictions.jsonl \
            v1_cg_verifications.jsonl \
            v1_cg_summary.json
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Record independent V1-CG research"

            pushed=false
            for attempt in $(seq 1 12); do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep 2
            done

            if [ "$pushed" != true ]; then
              echo "Research persistence failed"
              exit 1
            fi
          fi

      - name: Send V1-CG Telegram research notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 v1_cg_telegram.py

      - name: Persist V1-CG Telegram deduplication state
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f v1_cg_telegram_state.json ]; then
            echo "No Telegram state changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v1_cg_telegram_state.json

          if git diff --cached --quiet; then
            echo "No new Telegram events"
            exit 0
          fi

          git commit -m "Persist V1-CG Telegram notification state"

          pushed=false
          for attempt in $(seq 1 12); do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 2
          done

          if [ "$pushed" != true ]; then
            echo "Telegram state persistence failed"
            exit 1
          fi
