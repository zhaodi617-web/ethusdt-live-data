name: Observer V1 Path Audit (Independent)

on:
  workflow_run:
    workflows: ["Observer Ladder V3 Shadow Research"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-v1-path-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read archived market data and original V1 records
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Test V1 path audit
        run: python3 -m unittest -q test_v1_path_verify.py
      - name: Audit observed 15-minute price paths
        run: python3 v1_path_verify.py
      - name: Commit ONLY independent path audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1_path_results.jsonl v1_path_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Record independent V1 price path audit"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new V1 path evaluations"
          fi
