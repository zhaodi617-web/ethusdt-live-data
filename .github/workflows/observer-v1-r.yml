name: Observer Ladder V1-R Independent Multi-Horizon Research

on:
  workflow_run:
    workflows: ["Update OKX ETH Price"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-v1-r-research
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Test independent V1-R
        run: python3 -m unittest -q test_observer_v1_r.py

      - name: Generate forward-only predictions and verify prior horizons
        run: python3 observer_v1_r.py

      - name: Persist ONLY V1-R research outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v1_r_predictions.jsonl v1_r_latest.json v1_r_summary.json

          if [ -f v1_r_verifications.jsonl ]; then
            git add v1_r_verifications.jsonl
          fi

          if git diff --cached --quiet; then
            echo "No new V1-R data"
            exit 0
          fi

          git commit -m "Record independent V1-R multi-horizon research"

          pushed=false

          for attempt in $(seq 1 12); do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict. Stop safely."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "Push failed. Retrying..."
            sleep 2
          done

          if [ "$pushed" != true ]; then
            echo "Unable to push after 12 attempts"
            exit 1
          fi

          echo "V1-R research outputs saved successfully"
