name: Observer Ladder V1-R2 Precision Shadow

on:
  workflow_run:
    workflows: ["Observer Ladder V1-R Independent Multi-Horizon Research"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-v1-r2-precision
  cancel-in-progress: false

jobs:
  precision:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Run V1-R2 tests
        run: python3 -m unittest -q test_observer_v1_r2.py
      - name: Record forward-only shadow research
        run: python3 observer_v1_r2.py
      - name: Commit only independent V1-R2 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1_r2_activation.json v1_r2_summary.json
          for f in v1_r2_predictions.jsonl v1_r2_verifications.jsonl; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record V1-R2 forward precision research"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new V1-R2 data"
          fi
