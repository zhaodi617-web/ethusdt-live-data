name: Observer Ladder V1-S Reversal Shadow

on:
  workflow_run:
    workflows: ["Update OKX ETH Price"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-v1-s-reversal-shadow
  cancel-in-progress: false

jobs:
  reversal:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate reversal research syntax
        run: |
          python3 -m py_compile observer_v1_s_reversal.py
          python3 -m unittest -q test_observer_v1_s.py

      - name: Run independent forward-only reversal study
        run: python3 observer_v1_s_reversal.py

      - name: Persist only reversal research files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          files=(
            v1_s_reversal_activation.json
            v1_s_reversal_predictions.jsonl
            v1_s_reversal_verifications.jsonl
            v1_s_reversal_summary.json
          )

          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new reversal research records"
            exit 0
          fi

          git commit -m "Record forward-only V1-S reversal shadow"

          pushed=false

          for attempt in $(seq 1 12); do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict; stopping safely"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "Push failed; retrying"
            sleep 2
          done

          if [ "$pushed" != true ]; then
            echo "Unable to persist reversal research"
            exit 1
          fi

          echo "V1-S reversal research saved"
