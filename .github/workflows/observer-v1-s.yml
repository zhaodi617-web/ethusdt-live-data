name: Observer Ladder V1-S Independent Structural Shadow

on:
  workflow_run:
    workflows: ["Update OKX ETH Price"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-v1-s-structural
  cancel-in-progress: false

jobs:
  structural:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Test independent V1-S before running
        run: python3 -m unittest -q test_observer_v1_s.py

      - name: Run forward-only V1-S study
        run: python3 observer_v1_s.py

      - name: Persist ONLY V1-S outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add v1_s_activation.json v1_s_summary.json

          for f in v1_s_predictions.jsonl v1_s_verifications.jsonl; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new V1-S outputs"
            exit 0
          fi

          git commit -m "Record independent forward V1-S structural research"

          pushed=false

          for attempt in $(seq 1 12); do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict. Stop safely."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              pushed=true
              break
            fi

            echo "Push failed. Retrying..."
            sleep 2
          done

          if [ "$pushed" != true ]; then
            echo "Unable to push after 12 attempts"
            exit 1
          fi

          echo "V1-S research outputs saved successfully"
