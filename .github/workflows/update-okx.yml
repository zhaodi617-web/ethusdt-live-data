name: Update OKX ETH Price

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch OKX ETH price
        run: python3 fetch_okx.py

      - name: Fetch OKX candles
        run: python3 fetch_candles.py

      - name: Fetch derivatives data
        run: python3 fetch_derivatives.py

      - name: Record derivatives history
        run: python3 record_derivatives.py

      - name: Generate baseline prediction
        run: python3 predict_eth.py

      - name: Verify baseline predictions
        run: python3 verify_eth.py

      - name: Generate Observer early warning
        run: python3 observer_early.py

      - name: Verify Observer predictions
        run: python3 verify_observer.py

      - name: Send Telegram early alert
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_alert.py

      - name: Send new Observer verification results
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          diff = subprocess.run(
              ['git', 'diff', '--unified=0', '--', 'observer_verifications.jsonl'],
              capture_output=True,
              text=True,
              check=True
          ).stdout

          records = []

          for line in diff.splitlines():
              if line.startswith('+') and not line.startswith('+++'):
                  try:
                      record = json.loads(line[1:])
                  except json.JSONDecodeError:
                      continue

                  if record.get('result') in ('HIT', 'MISS', 'FLAT'):
                      records.append(record)

          if not records:
              print('No newly verified directional results')
          else:
              token = os.environ['TELEGRAM_BOT_TOKEN']
              chat_id = os.environ['TELEGRAM_CHAT_ID']

              for r in records:
                  ts = datetime.fromtimestamp(
                      r['prediction_time'] / 1000,
                      timezone.utc
                  ).strftime('%Y-%m-%d %H:%M UTC')

                  message = (
                      'Observer Ladder ETH - Verification\n\n'
                      f"Result: {r['result']}\n"
                      f"Signal: {r['signal']}\n"
                      f"Prediction: {ts}\n"
                      f"Reference: {r['reference_price']} USDT\n"
                      f"Verified: {r['verification_price']} USDT\n"
                      f"Price change: {r['return_pct']:+.3f}%\n\n"
                      'Direction test only, not trading P&L.'
                  )

                  data = urllib.parse.urlencode({
                      'chat_id': chat_id,
                      'text': message
                  }).encode()

                  request = urllib.request.Request(
                      f'https://api.telegram.org/bot{token}/sendMessage',
                      data=data,
                      method='POST'
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:
                      result = json.load(response)

                  if not result.get('ok'):
                      raise RuntimeError(
                          'Telegram result delivery failed'
                      )

                  print(
                      'Verification sent:',
                      r['prediction_time'],
                      r['result']
                  )
          PY

      - name: Generate Observer V2 paper analysis
        continue-on-error: true
        run: python3 observer_v2.py

      - name: Commit market data and predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add okx_latest.json
          git add okx_candles.json
          git add okx_derivatives.json
          git add okx_derivatives_history.jsonl
          git add eth_predictions.jsonl
          git add eth_accuracy.json

          for file in \
            eth_verifications.jsonl \
            observer_early_predictions.jsonl \
            observer_early_latest.json \
            observer_verifications.jsonl \
            observer_accuracy.json \
            telegram_last_sent.json \
            observer_v2_latest.json \
            observer_v2_observations.jsonl
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update ETH data and Observer V2"
            git pull --rebase origin main
            git push origin main
          fi
