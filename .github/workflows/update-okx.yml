name: Update OKX ETH Price

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch OKX ETH price
        run: python3 fetch_okx.py

      - name: Fetch OKX candles
        run: python3 fetch_candles.py

      - name: Fetch derivatives data
        run: python3 fetch_derivatives.py

      - name: Generate ETH prediction
        run: python3 predict_eth.py

      - name: Verify ETH predictions
        run: python3 verify_eth.py

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add okx_latest.json
          git add okx_candles.json
          git add okx_derivatives.json
          git add eth_predictions.jsonl
          git add eth_accuracy.json

          if [ -f eth_verifications.jsonl ]; then
            git add eth_verifications.jsonl
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update OKX ETH market data"
            git push
          fi
