name: Update OKX ETH Price

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch OKX ETH price
        run: python3 fetch_okx.py

      - name: Commit latest price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add okx_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OKX ETH price"
            git push
          fi
