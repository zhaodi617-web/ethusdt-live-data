name: WatcherGuru News Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: watcherguru-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Read WatcherGuru news
        run: python3 watcherguru_monitor.py

      - name: Save news and deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add watcherguru_seen.json watcherguru_news.json

          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi

          git commit -m "Update WatcherGuru news monitoring state"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "News state saved"
              exit 0
            fi

            echo "Retrying save: $attempt"
            sleep 5
          done

          echo "Failed to save news state"
          exit 1
